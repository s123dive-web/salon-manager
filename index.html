<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the iPhone notch and home indicator; the
         app then pays that back with env(safe-area-inset-*) padding on the bottom tab bar and
         the fixed status pill. Without it, iOS letterboxes the page and the insets read 0.
         `user-scalable` is deliberately NOT set: pinch-zoom stays available, because a salon
         owner reading a small total should never be stopped from zooming in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tints the Android/Chrome address bar and the iOS status bar to match the app shell.
         Two values so the bar follows whichever appearance the device is set to. -->
    <meta name="theme-color" content="#10331f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17111D" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Salon Manager" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo.svg" />
    <title>Salon Manager — Appointments, Billing & CRM</title>
    <style>
      * { margin: 0; }
      html, body, #root { height: 100%; }
      body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      /* A phone must never be able to scroll the whole page sideways: wide content
         (tables, the appointments calendar) scrolls inside its own container instead. */
      html, body { overflow-x: hidden; overscroll-behavior-x: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
