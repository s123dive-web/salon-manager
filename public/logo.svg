<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Salon Manager logo">
  <defs>
    <linearGradient id="salonBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17583A"/>
      <stop offset="1" stop-color="#0B291B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#salonBg)"/>
  <!-- salon scissors: handles (rings) at the base, blades opening upward -->
  <g fill="none" stroke="#F5F0E6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 43.5 L45 15.5"/>
    <path d="M43 43.5 L19 15.5"/>
    <circle cx="20.4" cy="44.4" r="4.6"/>
    <circle cx="43.6" cy="44.4" r="4.6"/>
  </g>
  <!-- pivot -->
  <circle cx="32" cy="30.6" r="2.3" fill="#E7B24A"/>
</svg>
